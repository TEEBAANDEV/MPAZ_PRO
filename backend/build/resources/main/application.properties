server.port=8080
spring.application.name=mpaz-backend

# Base de datos H2 persistente en archivo
spring.datasource.url=jdbc:h2:file:/app/data/mpazdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola H2 habilitada para inspeccionar en /h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Clave secreta JWT
mpaz.jwt.secret=MpazPro2026ClaveSecretaSuperSeguraParaJwtTokenDe256Bits
mpaz.jwt.expiration=86400000
